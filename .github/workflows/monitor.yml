name: Monitor da portaria

# Fica ligado por ~5h40, checando o site a cada 10 minutos.
# No fim, ele mesmo inicia a próxima rodada (corrente sem fim).
# O agendamento de hora em hora é só um "reserva": se a corrente cair, ele religa.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright-core@1

      - name: Checar a cada 10 minutos
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          fim=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$fim" ]; do
            echo "=== $(TZ=America/Sao_Paulo date '+%d/%m %H:%M') ==="
            timeout 150 node monitor.mjs || echo "Falha nesta checagem, tento de novo em 10 min."
            git add last_status.txt 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -qm "status: $(cat last_status.txt)" && git push -q || true
            fi
            sleep 600
          done

      - name: Iniciar a próxima rodada
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref main --repo "${{ github.repository }}"
